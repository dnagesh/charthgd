#P1.2 Continue a draft report
##P1_2.title=Continue a draft report
##P1_2.paragraph1=You will need the reference code we sent you after saving the serious incident report - you will not be able to access the saved report without it.
##P1_2.subtitle1=How to continue your report?
##P1_2.list1.item1=Enter your reference code - you'll be taken to the start of your report
##P1_2.list1.item2=Go through the information you've already entered - you can change anything you entered along the way.
##P1_2.list1.item3=Continue your report from where you previously saved it.
##P1_2.inset.text1=The Charity Commission cannot access information in reports that are not yet complete. We only receive information when you submit the full report.
##P1_2.textbox1.hint=Enter your unique reference code

#P1.3 Authority to report an incident
##P1_3.title=Authority to report an incident
##P1_3.inset.text1=You must only report a serious incident on behalf of a charity if you have been authorised to do so by the trustees
##P1_3.paragraph1=If you have not been authorised by the trustees to report a serious incident but need to report concerns about a charity, please read our guidance <a href="https://www.gov.uk/complain-about-charity" class="govuk-link">here</a>.
##P1_3.question1=Do you have authority to report the incident(s) on behalf of the trustees?

#P1.3a You must obtain authority to report incident(s)
##P1_3a.title=You must obtain authority to report incident(s)
##P1_3a.paragraph1=You must obtain authority to report from the trustees and resubmit this form. If you do not have authority from the trustees but need to report concerns about a charity, please read our guidance here:
##P1_3a.link1=<a href="https://www.gov.uk/complain-about-charity" class="govuk-link">Complain about a charity</a>
##P1_3a.subheading1=If you're an employee or volunteer
##P1_3a.paragraph2=There is specific guidance here:
##P1_3a.link2=<a href="https://www.gov.uk/guidance/report-serious-wrongdoing-at-a-charity-as-a-worker-or-volunteer" class="govuk-link">Report serious wrong doing at a charity as a worker or volunteer</a>
##P1_3a.subheading2=If you're an auditor or independent examiner
##P1_3a.paragraph3=Specific guidance can be found at:
##P1_3a.link3=<a href="https://www.gov.uk/government/publications/guidance-for-auditors-and-independent-examiners-of-charities" class="govuk-link">Matters of material significance and reporting by auditors and independent examiners to the charity regulator</a>
##P1_3a.link4=<a href="https://www.gov.uk/government/publications/reporting-relevant-matters-of-interest-to-uk-charity-regulators" class="govuk-link">Reporting relevant matters of interest to UK charity regulators</a>

