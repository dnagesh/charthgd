#P1.11.2 Have the Police been informed?
##P1_11_2.title=Have the Police been informed?
##P1_11_2.helpSummary=Help about: What you should know
##P1_11_2.helpParagraph1=If a reportable incident involves actual or alleged criminal activity then you must also report it to the relevant agencies:
##P1_11_2.helpList1=safeguarding incidents: you should report allegations or incidents of abuse or mistreatment of people who come into contact with your charity through its work to:<ul class="govuk-list govuk-list--bullet"><li>the police and obtain a crime reference number (call 101 or make a report at a local police station), and</li><li>the local authority and other relevant agencies</li></ul>
##P1_11_2.helpList2=fraud and cyber-crime: you should report allegations or incidents of fraud and cyber-crime to <a class="govuk-link" href="https://www.actionfraud.police.uk/reporting-fraud-and-cyber-crime" target="_blank">Report Fraud</a> via its online reporting tool, ensuring you obtain a crime reference number and making clear that you're representing a charity
##P1_11_2.helpList3=theft: you should report allegations or incidents of theft to the police (call 101 or make a report at a local police station) and obtain a crime reference number
##P1_11_2.helpList4=links to terrorism and extremism: you should report links or alleged links to terrorism and extremism to the police and obtain a crime reference number. If you don't do this immediately, you may be committing a criminal offence under Section 19 of the Terrorism Act 2000. You can report this type of incident to the police in the following ways:<ul class="govuk-list govuk-list--bullet"><li>via the <a class="govuk-link" href="https://www.nationalcrimeagency.gov.uk/" target="_blank">National Crime Agency website</a></li><li>call the Metropolitan Police Anti-Terrorist Hotline on 0800 789 321</li><li>call 101 or report it at a local police station</li></ul>
##P1_11_2.helpList5=criminal activity overseas: you should usually report any actual or alleged criminal activity that takes place overseas to local law enforcement authorities and/or safeguarding organisations in the location where this occurred. There may also be circumstances where it is necessary to report this to UK authorities. For further guidance on this, please see the Commission's guidance on criminal reporting
##P1_11_2.guidanceLink=<a class="govuk-link" href="https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/754070/guidance_on_criminal_reporting_inc_overseas.pdf" target="_blank">Guidance on criminal reporting including overseas</a> (PDF, 169 KB, 2 pages)

