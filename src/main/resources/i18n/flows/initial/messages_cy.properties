#P1.6 Describe incident type
##P1_6.title=Describe the incident type
##P1_6.hint=Choose the best option to describe the incident type
##P1_6.radio.incidentType1=Protecting people and safeguarding incidents
##P1_6.radio.incidentType2=Financial crime
##P1_6.radio.incidentType2.hint=Including fraud, cyber crime, theft and money laundering
##P1_6.radio.incidentType3=Unverified or suspicious donations or financial activity
##P1_6.radio.incidentType4=Other significant financial loss
##P1_6.radio.incidentType5=Links to terrorism or extremism
##P1_6.radio.incidentType6=Other significant incidents
##P1_6.radio.incidentType6.hint=For example insolvency, forced withdrawal or banking services without alternative,significant data breaches/losses, incidents involving partner the materially affect the charity
##P1_6.helpText.summary=Help about: Other significant incidents
##P1_6.helpText.paragraph=Other significant incidents include:
##P1_6.helpText.listItem1=An incident has occurred involving one of your charity's partners in the UK or internationally which has materially affected your charity, its staff, operations and/or reputation.
##P1_6.helpText.listItem2=It has been discovered that one of the charity's trustees or a senior manager is disqualified from acting.
##P1_6.helpText.listItem3=Something has happened to force your charity into insolvency or to wind up (e.g. unmanageable debts or reduced income streams).
##P1_6.helpText.listItem4=Your charity's operations are threatened because your main or only bank has withdrawn banking services, and you can't find another bank that will accept you.
##P1_6.helpText.listItem5=Your charity is subject to a police investigation or a significant investigation by another regulator/agency.
##P1_6.helpText.listItem6=Major governance issues, or other events, leaving the charity unable to operate (e.g. mass resignation of staff/trustees).
##P1_6.helpText.listItem7=The charity's trustees or employees are subject to criminal proceedings connected with the charity or their role in it.
##P1_6.helpText.listItem8=There has been a significant data breach or loss within your charity.

