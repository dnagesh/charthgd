#P1.0 Report a serious incident on behalf of the trustees

#P1.0 section one
##P1_0.title=Report a serious incident on behalf of the trustees
##P1_0.paragraph1=Use this form if you have the authority of the trustees to report a serious incident to the Charity Commission.
##P1_0.paragraph2=You can save your form at any point by clicking on the <strong>Save and come back later</strong> button. Once saved you will be able to download and print your form.
##P1_0.paragraph3=You can use the form to report more than one serious incident by selecting the "report another incident" button on the declaration page.
##P1_0.paragraph4=You can also use this form to send us an update on a report you've already submitted. You'll need your reference number.

#P1.0 section two
##P1_0.subtitle2=Before you start

#P1.0 list1
##P1_0.list1.info=To use this form you'll need contact details, including:
##P1_0.list1.item1=your own contact details the charity name and, if it's registered, the registration number
##P1_0.list1.item2=reference numbers and contact details, if you've reported it to other organisations, like the police
##P1_0.list1.item3=names and registration numbers of other charities involved in the incident, if relevant

#P1.0 list2
##P1_0.list2.info=You'll also need incident details, including:
##P1_0.list2.item1=date of the incident
##P1_0.list2.item2=what happened
##P1_0.list2.item3=date the charity found out about the incident
##P1_0.list2.item4=how the charity found out about the incident
##P1_0.list2.item5=whether trustees are aware of the incident
##P1_0.list2.item6=what impact the incident has had on the charity's beneficiaries, finances, staff, operations or reputation

#P1.0 list 3
##P1_0.list3.info=You'll also need details of how your charity is handling the incident, including:
##P1_0.list3.item1=which of the charity's policies or procedures relate to the incident, and whether they were followed
##P1_0.list3.item2=what steps the charity has taken to deal with the incident
##P1_0.list3.item3=what steps the charity has taken to prevent similar incidents
##P1_0.list3.item4=if applicable, the charity's media handling or press lines, including a link to a press release if available

#P1.0 section 3
##P1_0.subtitle3=How we use personal data
##P1_0.section3.paragraph1=Do not give us personal data about other people. Only include it if it is essential to making your report. For example, say 'an individual has stolen from the charity' instead of 'Joe Bloggs has stolen from the charity'.
##P1_0.section3.paragraph2=If we need more details, we'll ask for them after you submit your report.
##P1_0.section3.paragraph3=The Information Commissioner's Office explains Hyperlink <a class="govuk-link" href="https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/personal-information-what-is-it/what-is-personal-information-a-guide/">what personal data is</a>:
##P1_0.list4.info=This form will ask for the following personal data:
##P1_0.list4.item1=your name, telephone number, email address and your connection with the charity so that we can contact you for clarification or further information if required (we also need a record of the person submitting the report on behalf of the charity)
##P1_0.list4.item2=the name, date of birth and address of any trustees of the charity who are disqualified and the reason for disqualification so that we can verify the information, assess any risks to other charities and determine whether any regulatory action is required
##P1_0.list4.item3=where you have reported the serious incident to another regulator/agency, the name and contact details of your contact at that regulator/agency so that we can contact them for more information if required and, in some cases, coordinate our response
##P1_0.section3.paragraph4=<a class="govuk-link" href="https://www.gov.uk/government/publications/report-a-serious-incident-in-your-charity-privacy-notice" >Our privacy notice</a> explains how we use the personal data in this form

#P1.0 section 4
##P1_0.subtitle4=Report a serious incident to the Charity Commission
##P1_0.section4.paragraph1=Use our form to report serious incident or update an incident already reported

