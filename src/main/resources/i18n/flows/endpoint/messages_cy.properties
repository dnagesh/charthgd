#P9.2 Declatation
##P9_2.title=Declaration
##P9_2.warningText=It is a criminal offence under Section 60 of the Charities Act  2011 for anyone to knowingly or recklessly provide false or misleading information to the Commission; this includes suppressing, concealing or destroying documents.
##P9_2.checkBoxText=I confirm that the information I have provided in this service is true and correct to the best of my knowledge

#P9.3 Submission receipt
##P9_3.title=Submission receipt
##P9_3.bannerBody=Thank you. Your serious incident report has been updated and sent to the Charity Commission.
##P9_3.paragraph1=Your incident reference number can be found in your confirmation email.
##P9_3.heading2=What happens next
##P9_3.paragraph2=You'll get an email to confirm your report has been submitted. Keep a copy of this email for your records. It includes:
##P9_3.list1.item1=A PDF copy of your report.
##P9_3.list1.item2=A copy of your incident reference number.
##P9_3.heading3=If you need to update your report
##P9_3.paragraph3=If you've made a mistake, or need to tell us information about this incident, you can also use this form to give us an update at any time. You'll need your incident reference number.

#P9.4 Your draft incident report has been saved
##P9_4.title=Your draft incident report has been saved
##P9_4.bannerBody=Your unique reference code is
##P9_4.paragraph1=We've saved your incident report and sent instructions on continuing to your report in an email.
##P9_4.insetTextLine1=You will need this reference code to access draft:
##P9_4.insetTextLine2=Keep this number safe as you won't be able to access your saved report without it.
##P9_4.downloadButtonLabel=Download form progress (PDF)
##P9_4.heading2=How to continue a report
##P9_4.list1.item1=Return to the report a serious incident service.
##P9_4.list1.item2=Select 'I am continuing a previous report'.
##P9_4.list1.item3=Enter your reference number - you'll be taken to the start of your report.
##P9_4.list1.item4=Go through the information you already entered - you can edit it if you need to.
##P9_4.list1.item5=You can then continue your report from where you previously saved it.
##P9_4.paragraph2=You can save your progress again if you need to.
##P9_4.paragraph3=The Charity Commission cannot access information in reports that are not complete. We only receive information when you submit the full report.
##P9_4.warningText=If you do not continue your report within 30 days, we will delete it.