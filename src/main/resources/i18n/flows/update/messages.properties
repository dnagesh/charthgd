#P8.0 Updating an existing serious incident
P8.caption=Charity and contact details
P8_0.title=Updating an existing serious incident
P8_0.inset.text1=You must only update a serious incident on behalf of a charity if you have been authorised to do so by the trustees. If you have not been authorised by the trustees to report a serious incident but need to report concerns about a charity, please read our guidance <a class="govuk-link" href="https://www.gov.uk/complain-about-charity" target="_blank">here</a>.
P8_0.question1=Do you have authority to update the incident(s) on behalf of the trustees?

#P8.0a
P8_0a.title=You must obtain authority to update the incident(s)
P8_0a.paragraph1=You must obtain authority to update the incident(s) from the trustees and resubmit this form. If you do not have authority from the trustees but need to report concerns about a charity, please read our guidance here:
P8_0a.link1=<a class="govuk-link" href="https://www.gov.uk/complain-about-charity">Complain about a charity</a>
P8_0a.subheading1=If you're an employee or volunteer
P8_0a.paragraph2=There is specific guidance here:
P8_0a.link2=<a class="govuk-link" href="https://www.gov.uk/guidance/report-serious-wrongdoing-at-a-charity-as-a-worker-or-volunteer">Report serious wrong doing at a charity as a worker or volunteer</a>
P8_0a.subheading2=If you're an auditor or independent examiner
P8_0a.paragraph3=Specific guidance can be found at:
P8_0a.link3=<a class="govuk-link" href="https://www.gov.uk/government/publications/guidance-for-auditors-and-independent-examiners-of-charities">Matters of material significance and reporting by auditors and independent examiners to the charity regulator</a>
P8_0a.link4=<a class="govuk-link" href="https://www.gov.uk/government/publications/reporting-relevant-matters-of-interest-to-uk-charity-regulators">Reporting relevant matters of interest to UK charity regulators</a>

