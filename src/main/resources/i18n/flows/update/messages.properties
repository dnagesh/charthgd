#P8.9 Trustee assurance
P8_9.title=Trustee assurance
P8_9.paragraph1=Are the charity trustees satisfied that the action taken in response to the incident gives them assurance that it has been properly managed, the appropriate organisations and/or statutory bodies have been notified and adequate procedures are in place to manage any live risks to the charity and the people who come into contact with it through its work?
P8_9.textarea.label=Explain why the trustees are not satisfied about this