test.details.html= <h2 class="govuk-heading-m">How we use personal data</h2>\
<p>Do not give us personal data about other people. Only include it if it is essential to making your report. \
For example, say 'an individual has stolen from the charity' instead of 'Joe Bloggs has stolen from the charity'.</p>\
<p>If we need more details, we'll ask for them after you submit your report.</p>\
<p>The Information Commissioner's Office explains \
<a href="https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/personal-information-what-is-it/what-is-personal-information-a-guide/" class="govuk-link">what personal data is</a>.</p>\
<p>This form will ask for the following personal data:</p>\
<ul class="govuk-list govuk-list--bullet">\
<li>your name, telephone number, email address and your connection with the charity so that we can contact you for clarification or further information if required (we also need a record of the person submitting the report on behalf of the charity)</li>\
<li>the name, date of birth and address of any trustees of the charity who are disqualified and the reason for disqualification so that we can verify the information, assess any risks to other charities and determine whether any regulatory action is required</li>\
<li>where you have reported the serious incident to another regulator/agency, the name and contact details of your contact at that regulator/agency so that we can contact them for more information if required and, in some cases, coordinate our response</li>\
</ul>\
<p><a href="https://www.gov.uk/government/publications/report-a-serious-incident-in-your-charity-privacy-notice" class="govuk-link">Our privacy notice</a> explains how we use the personal data in this form</p>\
<h2 class="govuk-heading-m">Report a serious incident to the Charity Commission</h2>\
<p>Use our form to report a new serious incident or update an incident already reported.</p>


