<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{sections/_layout :: content(~{::section})}">
    <section>
        <h2>Page 1.1 – Choose Your Flow</h2>
        <p>Select what you want to do:</p>

        <form th:action="@{/nav/next}" method="post">
            <label><input type="radio" name="answer" value="new" required/> New Application</label><br/>
            <label><input type="radio" name="answer" value="continue"/> Continue Application</label><br/>
            <label><input type="radio" name="answer" value="update"/> Update Existing Application</label><br/><br/>
            <button type="submit">Next</button>
        </form>

        <form th:action="@{/nav/prev}" method="post" style="margin-top:10px;">
            <button type="submit">Previous</button>
        </form>
    </section>
</div>
</body>
</html>
