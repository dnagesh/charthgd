<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{sections/_layout :: content(~{::section})}">
    <section>
        <h2>Page 1.3 – Eligibility Question</h2>
        <p>Do you want to continue to the next part?</p>

        <form th:action="@{/nav/next}" method="post">
            <label><input type="radio" name="answer" value="yes" required/> Yes</label><br/>
            <label><input type="radio" name="answer" value="no"/> No</label><br/><br/>
            <button type="submit">Next</button>
        </form>

        <form th:action="@{/nav/prev}" method="post" style="margin-top:10px;">
            <button type="submit">Previous</button>
        </form>
    </section>
</div>
</body>
</html>
