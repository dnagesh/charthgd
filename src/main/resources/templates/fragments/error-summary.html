<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error Summary Fragment</title>
</head>
<body>
<!--
    Reusable Error Summary Component
    Include this fragment at the top of each form page to display validation errors

    Usage in your templates:
    <div th:replace="~{fragments/error-summary :: error-summary}"></div>
-->

<div th:fragment="error-summary" th:if="${hasErrors != null and hasErrors}">
    <div class="govuk-error-summary" aria-labelledby="error-summary-title" role="alert" tabindex="-1" data-module="govuk-error-summary">
        <h2 class="govuk-error-summary__title" id="error-summary-title">
            There is a problem
        </h2>
        <div class="govuk-error-summary__body">
            <ul class="govuk-list govuk-error-summary__list">
                <li th:each="error : ${errorSummary}">
                    <a th:href="${error.anchor}" th:text="${error.errorMessage}">Error message</a>
                </li>
            </ul>
        </div>
    </div>
</div>

<!--
    Field-level Error Message Component
    Use this fragment to display error message above a specific field

    Usage in your templates:
    <span th:replace="~{fragments/error-summary :: field-error(${#fields.hasErrors('fieldName')}, 'fieldName')}"></span>
-->

<span th:fragment="field-error(hasError, fieldName)"
      th:if="${hasError}"
      th:id="${'error-' + fieldName}"
      class="govuk-error-message">
        <span class="govuk-visually-hidden">Error:</span>
        <span th:text="${#fields.errors(fieldName)[0]}">Error message</span>
    </span>

<!--
    Form Group with Error Styling
    Use this to wrap form fields with automatic error styling

    Usage:
    <div th:replace="~{fragments/error-summary :: form-group('fieldName', ${#fields.hasErrors('fieldName')})}">
-->

<div th:fragment="form-group-wrapper(fieldName, hasError)"
     th:class="${hasError ? 'govuk-form-group govuk-form-group--error' : 'govuk-form-group'}">
    <!-- Content will be provided by the calling template -->
</div>

</body>
</html>
