<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<!--/*
================================================================================
FRAGMENT: charitySearchBox

A search box for looking up charity information by number or name.
================================================================================
*/-->
<div th:fragment="charitySearchBox" class="govuk-form-group">
    <fieldset class="govuk-fieldset">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--m">
            <h2 class="govuk-fieldset__heading">
                Search for a Charity
            </h2>
        </legend>

        <div class="govuk-hint">
            Enter a charity number (e.g., 123456) or charity name (e.g., oxfam)
        </div>

        <form method="post" th:action="@{/form/search-charity}" id="charitySearchForm">
            <div class="govuk-form-group">
                <label class="govuk-label" for="charityInput">
                    Charity Number or Name
                </label>
                <input class="govuk-input govuk-input--width-20"
                       id="charityInput"
                       name="charityInput"
                       type="text"
                       placeholder="Enter charity number or name"
                       required>
            </div>

            <button type="submit" class="govuk-button govuk-button--secondary" data-module="govuk-button">
                Search Charity
            </button>
        </form>
    </fieldset>
</div>

<!--/*
================================================================================
FRAGMENT: charitySearchInline (for inline search in text inputs)

A compact search box that can be embedded within other form fields.
================================================================================
*/-->
<div th:fragment="charitySearchInline" class="govuk-form-group">
    <label class="govuk-label" for="charityInputInline">
        Search for Charity
    </label>
    <div class="govuk-hint">
        Enter charity number or name
    </div>
    <div style="display: flex; gap: 10px;">
        <input class="govuk-input govuk-input--width-20"
               id="charityInputInline"
               name="charityInput"
               type="text"
               placeholder="e.g., 123456 or oxfam">
        <button type="button"
                onclick="searchCharityInline()"
                class="govuk-button govuk-button--secondary"
                data-module="govuk-button">
            Search
        </button>
    </div>
</div>

<script th:fragment="charitySearchScript">
    function searchCharityInline() {
        const input = document.getElementById('charityInputInline').value;
        if (input.trim() === '') {
            alert('Please enter a charity number or name');
            return;
        }

        // Create form and submit
        const form = document.createElement('form');
        form.method = 'post';
        form.action = '/form/search-charity';

        const inputField = document.createElement('input');
        inputField.type = 'hidden';
        inputField.name = 'charityInput';
        inputField.value = input;

        form.appendChild(inputField);
        document.body.appendChild(form);
        form.submit();
    }
</script>

</html>
