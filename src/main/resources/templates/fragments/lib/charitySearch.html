<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="charitySearchBox" class="govuk-form-group">
    <fieldset class="govuk-fieldset">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--m">
            <h2 class="govuk-fieldset__heading">Search for a Charity</h2>
        </legend>

        <div class="govuk-hint">
            Enter a charity number (e.g., 123456) or charity name (e.g., Oxfam)
        </div>

        <div class="govuk-form-group" th:classappend="${errors != null and errors.hasFieldErrors('charityInput')}
                      ? 'govuk-form-group--error'">
            <label class="govuk-label" for="charityInput">
                Charity number or name
            </label>

            <p class="govuk-error-message"
               th:if="${errors != null and errors.hasFieldErrors('charityInput')}">
                <span class="govuk-visually-hidden">Error:</span>
                <span th:text="${errors.getFieldError('charityInput').defaultMessage}">This field is required</span>
            </p>

            <input class="govuk-input govuk-input--width-20"
                   id="charityInput"
                   name="charityInput"
                   type="text"
                   th:value="${param.charityInput}">
        </div>

        <div class="govuk-form-group">
            <label class="govuk-label" for="lang">
                Language
            </label>
            <select class="govuk-select" id="lang" name="lang">
                <option value="en" th:selected="${param.lang == null || param.lang == 'en'}">English</option>
                <option value="cy" th:selected="${param.lang == 'cy'}">Welsh</option>
            </select>
        </div>

        <button type="submit"
                class="govuk-button govuk-button--secondary"
                formaction="/form/search-charity"
                formmethod="post">
            Search charity
        </button>
    </fieldset>
</div>

</html>
