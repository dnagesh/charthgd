<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--/*
================================================================================
FRAGMENT: textinput (labelText, width)

Params:
- labelText = The label text that appears on top of the input area.
- width = the horizontal size of the input.
================================================================================
*/-->
<div th:fragment="textinput (labelText, width)"
     th:with="type='textinput',pageName=${#execInfo.processedTemplateName}, name=${@formUtil.generateName(type,pageName)}, ID=${#ids.seq(name)}, userAnwser=${data} " class="govuk-form-group">
    <label class="govuk-label"
           th:for="${ID}"
           th:text="${labelText ?: ''}">
    </label>
    <input th:class="${'govuk-input govuk-input--width-'+width}"
           th:id="${ID}"
           th:name="${ID}"
           th:value="${@formUtil.dataValue(ID,userAnwser)}"
           type="text">
</div>

<!--/*
================================================================================
FRAGMENT: textinputValidation (labelText, width, fieldName)

Params:
- labelText = The label text that appears on top of the input area.
- width = the horizontal size of the input.
- fieldName = The field name key (e.g., 'P1.2-input') for dynamicFields Map
================================================================================
*/-->
<div th:fragment="textinputValidation (labelText, width, fieldName)"
     th:with="fieldPath=${'dynamicFields[' + fieldName + ']'}, inputId=${fieldName + '-text'}"
     class="govuk-form-group">
    <label class="govuk-label"
           th:for="${inputId}"
           th:text="${labelText ?: ''}">
    </label>

    <!-- Inline error message without red box -->
    <p th:if="${#fields.hasErrors(fieldPath)}"
       class="govuk-error-message">
        <span class="govuk-visually-hidden">Error:</span>
        <span th:text="${#fields.errors(fieldPath)[0]}">This field is required</span>
    </p>

    <input th:class="${'govuk-input govuk-input--width-'+width}"
           th:id="${inputId}"
           th:name="${fieldPath}"
           th:field="*{__${fieldPath}__}"
           type="text">
</div>
