<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!--TODO:To change in the future depending on the approach of Object or individual errors or if the components need wrapping.-->
<div th:fragment="summary(bindingResult)"
     th:if="${bindingResult != null and bindingResult.hasErrors()}"
     class="govuk-error-summary" data-module="govuk-error-summary">
    <div role="alert">
        <h2 class="govuk-error-summary__title">
            There is a problem
        </h2>
        <div class="govuk-error-summary__body">
            <ul class="govuk-list govuk-error-summary__list">
                <li th:each="error : ${bindingResult.allErrors}">
                    <a th:href="'#'+${error.field}"
                       th:text="${error.defaultMessage}">Error message</a>
                </li>
            </ul>
        </div>
    </div>
</div>

</html>
