<div th:fragment="dateInput(title, fieldName)"
     th:with="
        hasFieldError=${hasErrors == true
            and fieldErrors != null
            and fieldErrors.containsKey(fieldName)},
        errorMessage=${(fieldErrors != null and fieldErrors.containsKey(fieldName))
            ? fieldErrors.get(fieldName)
            : null},
        errorId=${fieldName + '-error'},
        fieldsetId=${fieldName + '-fieldset'},
        hintId=${fieldName + '-hint'}
     "
     th:class="${hasFieldError
        ? 'govuk-form-group govuk-form-group--error'
        : 'govuk-form-group'}">

    <fieldset class="govuk-fieldset"
              th:id="${fieldsetId}"
              th:aria-describedby="${hasFieldError ? errorId : null}">

        <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
            <h1 class="govuk-fieldset__heading"
                th:text="${title}">
            </h1>
        </legend>

        <div th:id="${hintId}" class="govuk-hint">
            For example, 27 3 2007
        </div>

        <!-- Inline error -->
        <p th:if="${hasFieldError}"
           th:id="${errorId}"
           class="govuk-error-message">
            <span class="govuk-visually-hidden">Error:</span>
            <span th:text="${errorMessage}"></span>
        </p>

        <div class="govuk-date-input" th:id="${fieldName}">

            <!-- Day -->
            <div class="govuk-date-input__item">
                <div class="govuk-form-group">
                    <label class="govuk-label govuk-date-input__label"
                           th:for="${fieldName + '-day'}">Day</label>
                    <input class="govuk-input govuk-date-input__input govuk-input--width-2"
                           th:id="${fieldName + '-day'}"
                           th:name="${fieldName + '-day'}"
                           th:value="${@formUtil.dataValue(fieldName + '-day', data)}"
                           inputmode="numeric"
                           type="text">
                </div>
            </div>

            <!-- Month -->
            <div class="govuk-date-input__item">
                <div class="govuk-form-group">
                    <label class="govuk-label govuk-date-input__label"
                           th:for="${fieldName + '-month'}">Month</label>
                    <input class="govuk-input govuk-date-input__input govuk-input--width-2"
                           th:id="${fieldName + '-month'}"
                           th:name="${fieldName + '-month'}"
                           th:value="${@formUtil.dataValue(fieldName + '-month', data)}"
                           inputmode="numeric"
                           type="text">
                </div>
            </div>

            <!-- Year -->
            <div class="govuk-date-input__item">
                <div class="govuk-form-group">
                    <label class="govuk-label govuk-date-input__label"
                           th:for="${fieldName + '-year'}">Year</label>
                    <input class="govuk-input govuk-date-input__input govuk-input--width-4"
                           th:id="${fieldName + '-year'}"
                           th:name="${fieldName + '-year'}"
                           th:value="${@formUtil.dataValue(fieldName + '-year', data)}"
                           inputmode="numeric"
                           type="text">
                </div>
            </div>

        </div>
    </fieldset>
</div>
