<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Include GOV.UK CSS -->
    <link rel="stylesheet" th:href="@{/govuk/css/govuk-frontend.min.css}">
</head>
<body class="govuk-template__body">

<!-- Header -->
<div th:replace="fragments :: header"></div>

<main class="govuk-main-wrapper" id="main-content">

    <!-- Top Button -->
    <div class="govuk-!-margin-bottom-6">
        <a th:href="@{/previous}" class="govuk-button govuk-button--secondary">
            Continue a previous report
        </a>
    </div>

    <!-- Question Form -->
    <form th:action="@{/continue}" method="post" class="govuk-form-group">

        <!-- Section title (plain text, not bold) -->
        <p class="govuk-body govuk-!-margin-bottom-2">
            Reporting or updating a serious incident
        </p>

        <!-- Hint text -->
        <p class="govuk-label govuk-radios__label">
            Are you reporting a new serious incident or updating an existing one?
        </p>

        <!-- Radios -->
        <div class="govuk-radios" data-module="govuk-radios">
            <div class="govuk-radios__item">
                <input class="govuk-radios__input" id="newIncident" name="incidentType" type="radio" value="new">
                <label class="govuk-label govuk-radios__label" for="newIncident">
                    I am reporting a new serious incident
                </label>
            </div>

            <div class="govuk-radios__item">
                <input class="govuk-radios__input" id="updateIncident" name="incidentType" type="radio" value="update">
                <label class="govuk-label govuk-radios__label" for="updateIncident">
                    I am updating an incident already reported to the Commission
                </label>
            </div>
        </div>

        <!-- Continue button (GDS standard green) -->
        <button type="submit" class="govuk-button govuk-button--start govuk-!-margin-top-5">
            Continue
            <svg class="govuk-button__start-icon" xmlns="http://www.w3.org/2000/svg"
                 width="17.5" height="19" viewBox="0 0 33 40" role="presentation" focusable="false">
                <path fill="currentColor" d="M0 0h13l20 20-20 20H0l20-20z"></path>
            </svg>
        </button>

    </form>
</main>

<!-- Footer -->
<div th:replace="fragments :: footer"></div>

</body>
</html>
