<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="application-name" content="Report Serious Incident">
    <link rel="stylesheet" th:href="@{/css/govuk-frontend-5.11.1.min.css}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <title>Report a Serious Incident</title>
</head>
<body class="govuk-template__body">
<th:block th:insert="~{fragments/common :: header}"></th:block>
<th:block th:insert="~{fragments/common :: banner}"></th:block>

<div class="govuk-width-container">
    <!-- Top Button -->
    <a href="#" class="govuk-back-link">Back</a>
    <main class="govuk-main-wrapper" id="main-content" role="main">
        <div class="govuk-grid-row">
            <div class="govuk-grid-column-two-thirds">

                <form th:action="@{'/form/' + ${section} + '/' + ${page}}" th:object="${questionForm}" method="post" novalidate>

                    <div th:if="${#fields.hasErrors('answer')}" class="govuk-error-summary" role="alert">
                        <h2 class="govuk-error-summary__title">There is a problem</h2>
                        <ul class="govuk-list govuk-error-summary__list">
                            <li><a href="#answer" th:errors="*{answer}"></a></li>
                        </ul>
                    </div>
                    <div>

                        <th:block th:fragment="inactivity-phase-banner">
                            <nav id="secondary-nav" class="ccew-account-menu ccew-account-menu__container" aria-label="Account" data-module="ccew-account-menu">
                                <div class="ccew-account-menu__row">
                                    <div class="ccew-account-menu__inactivity-container">
                                        <div class="govuk-warning-text">
                                            <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
                                            <strong class="govuk-warning-text__text">
                                                <span class="govuk-visually-hidden">Warning</span>
                                                <span th:text="#{inactive.banner} ? : 'You will be logged out after 30 minutes of inactivity.'">You will be logged out after 30 minutes of inactivity.</span>
                                            </strong>
                                        </div>
                                    </div>
                                    <div class="ccew-account-menu__navigation-container">
                                        <ul class="ccew-account-menu__main">
                                            <li>
                                                <a href="/messages" class="ccew-account-menu__link">
                                                    <span th:text="#{message.liferay} ? : 'Messages'">Messages</span><span class="ccew-notification-badge">2</span>
                                                </a>
                                            </li>
                                            <li>
                                                <a href="/account" class="ccew-account-menu__link">
                                                    <span th:text="#{account.liferay} ? : 'Account'">Account</span>
                                                </a>
                                            </li>
                                            <li>
                                                <a href="/sign-out" class="ccew-account-menu__link">
                                                    <span th:text="#{signout} ? : 'Sign out'">Sign out</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </nav>
                        </th:block>

                    </div>

                    <!-- Section title (plain text, not bold) -->
                    <p class="govuk-body govuk-!-margin-bottom-2">
                        Report a serious incident
                    </p>


                    <fieldset class="govuk-fieldset">
                        <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
                            <h1 class="govuk-fieldset__heading" th:text="${questionText}"></h1>
                        </legend>

                        <p class="govuk-error-message" th:if="${#fields.hasErrors('answer')}">
                            <span class="govuk-visually-hidden">Error:</span>
                            <span th:errors="*{answer}"></span>
                        </p>
                        <!-- ✅ Radio question -->
                        <div th:if="${type == 'radio'}" class="govuk-form-group"
                             th:classappend="${#fields.hasErrors('answer')} ? 'govuk-form-group--error'">
                            <div class="govuk-radios">
                                <div th:each="opt : ${options}" class="govuk-radios__item">
                                    <input class="govuk-radios__input" type="radio" th:field="*{answer}" th:value="${opt.label}" />
                                    <label class="govuk-label govuk-radios__label" th:text="${opt.label}"></label>
                                </div>
                            </div>
                        </div>

                        <!-- ✅ Text question -->
                        <div th:if="${type == 'text'}" class="govuk-form-group"
                             th:classappend="${#fields.hasErrors('answer')} ? 'govuk-form-group--error'">
                            <label class="govuk-label" th:for="answer" th:text="${questionText}"></label>
                            <input class="govuk-input" type="text" th:field="*{answer}" />
                        </div>
                    </fieldset>
                    <!-- Continue button (GDS standard green) -->
                    <button type="submit" class="govuk-button govuk-button--start govuk-!-margin-top-5">
                        Continue
                        <svg class="govuk-button__start-icon" xmlns="http://www.w3.org/2000/svg"
                             width="17.5" height="19" viewBox="0 0 33 40" role="presentation" focusable="false">
                            <path fill="currentColor" d="M0 0h13l20 20-20 20H0l20-20z"></path>
                        </svg>
                    </button>

                </form>

            </div>
        </div>
    </main>
</div>

<th:block th:insert="~{fragments/common :: footer}"></th:block>

</body>
</html>
