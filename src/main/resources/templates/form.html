<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GDS Demo Form</title>
    <!-- Include GOV.UK CSS -->
    <link rel="stylesheet" th:href="@{/govuk/css/govuk-frontend.min.css}">
</head>
<body>

<!-- Header -->
<div th:replace="~{fragments :: header}"></div>

<main class="govuk-main-wrapper" id="main-content">
    <h1 class="govuk-heading-l">GDS Demo Form</h1>
    <p class="govuk-body">Please fill out the form below to test GOV.UK styling.</p>

    <form th:action="@{/form}" th:object="${user}" method="post" class="govuk-form-group">

        <!-- Name Field -->
        <div class="govuk-form-group" th:classappend="${#fields.hasErrors('name')}? 'govuk-form-group--error'">
            <label class="govuk-label" for="name">Full Name</label>
            <span class="govuk-hint">Enter your first and last name</span>
            <input type="text" th:field="*{name}" id="name" class="govuk-input" placeholder="John Doe">
            <p class="govuk-error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <!-- Email Field (new) -->
        <div class="govuk-form-group">
            <label class="govuk-label" for="email">Email Address</label>
            <span class="govuk-hint">We'll only use this to contact you</span>
            <input type="email" id="email" class="govuk-input" placeholder="john@example.com">
        </div>

        <!-- Comments Field -->
        <div class="govuk-form-group">
            <label class="govuk-label" for="comments">Comments</label>
            <textarea id="comments" class="govuk-textarea" rows="5" placeholder="Your comments here"></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="govuk-button">Submit Form</button>
    </form>
</main>

<!-- Footer -->
<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
