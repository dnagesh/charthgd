P8_0.inset.text1=You must only update a serious incident on behalf of a charity if you have been authorised to do so by the trustees. If you have not been authorised by the trustees to report a serious incident but need to report concerns about a charity, please read our guidance <a class="govuk-link" href="https://www.gov.uk/complain-about-charity">here</a>.
