spring:
  application:
    name: Themeleaf
server:
  port: 8081
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  web:
   resources:
     static-locations: classpath:/static/
inactive:
  banner: You will be logged out after 30 minutes
message:
  liferay: Message
account:
  liferay: Account
signout: Sign out