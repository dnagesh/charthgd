spring:
  application:
    name: Charity Commission RSI
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true

app:
  banner: You will be logged out after 30 minutes
  message:
    liferay: Message
  account:
    liferay: Account
  signout: Sign out

#logging:
#  level:
#    root: INFO
#    com:
#      smartsourcing:
#        charitycommission:
#          rsi: DEBUG
#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

wiremock:
  enabled: true
  port: 8090
  timeout: 5000
  api-key: ""

charity:
  api:
    base-url: http://localhost:8090

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    show-extensions: true
    show-common-extensions: true
    try-it-out-enabled: true
  show-actuator: false

logging:
  level:
    root: INFO
    com.smartsourcing.charitycommission: DEBUG
    org.springframework.web: INFO
    com.github.tomakehurst.wiremock: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"