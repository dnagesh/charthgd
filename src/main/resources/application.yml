spring:
  application:
    name: Charity Commission RSI
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8081
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true

app:
  banner: You will be logged out after 30 minutes
  message:
    liferay: Message
  account:
    liferay: Account
  signout: Sign out

logging:
  level:
    root: INFO
    com:
      smartsourcing:
        charitycommission:
          rsi: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"