spring:
  application:
    name: RSI Local

  mvc:
    favicon:
      enabled: false

  # Enable retry
  retry:
    enabled: true

  # Cache configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

#  datasource:
