sections:
    initialPages:
      pages:
        - id: "1.0"
        - id: "1.1"
          condition:
              new: flow_1
              continue: flow_2
              update: flow_3
      transition_to: nextSectionName
      flows:
        flow_1:
          pages:
            - id: "1.3"
              condition:
                no: flow_1_2
            - id: "1.4"
            - id: "1.5"
            - id: "1.6"
            - id: "1.7"
              condition:
                some: flow_1_7_1
            - id: "1.8"
              condition:
                single data: flow_1_8_1
                over a period of time: flow_1_8_2
            - id: "1.10"
              condition:
                no: flow_1_10_1
                overseas: flow_1_10_2
            - id: "1.11"
              condition:
                No: flow_1_11_1
                still ongoing: flow_1_11_2
            - id: "1.12"
              condition:
                yes: flow_1_12_1
            - id: "1.13"
            - id: "1.14"
              condition:
                yes: flow_1_14_1
          sub_flows:
            flow_1_7_1:
              pages:
                - id: "1.17a"
            flow_1_8_2:
              pages:
                - id: "1.9"
                  condition:
                    still ongoing: flow_1_9_1
                    Now over: flow_1_9_2
            flow_1_8_1:
              pages:
                - id: "1.8.1"
            flow_1_9_1:
              pages:
                - id: "1.9.1"
            flow_1_9_2:
              pages:
                - id: "1.9.2"
            flow_1_12_1:
              pages:
                - id: "1.12.1"
            flow_1_14_1:
              pages:
                - id: "1.14.1"
                - id: "1.14.2"
            flow_1_2:
              pages:
                - id: "1.3a"
                - id: "end"
  
        flow_2:
          pages:
            - id: "1.2"
              condition:
                default: flow_1
  
        flow_3:
          transition_to: update

    otherSignificantFinancialLoss:
      pages:
        - id: "7.0"
          condition:
            "1": flow_1
            "2": flow_2
            "3": flow_3
            "4": flow_4
        - id: "7.6"
        - id: "7.7"
        - id: "7.8"
        - id: "7.8"
        - id: "7.9"
        - id: "7.10"
        - id: "7.11"
      transition_to: nextSectionName
      flows:
        flow_1:
          pages:
            - id: "7.1"
            - id: "7.1.1"
        flow_2:
          pages:
            - id: "7.2"
              condition:
                "Trustee": flow_2_1
            - id: "7.2.1"
            - id: "7.2.2"
            - id: "7.2.3"
          sub_flows:
            flow_2_1:
              pages:
                - id: "7.2.0.1"
        flow_3:
          pages:
            - id: "7.3"
        flow_4:
          pages:
            - id: "7.4"
            - id: "7.4.1"
