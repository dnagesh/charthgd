<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error Summary Fragment</title>
</head>
<body>

<div th:fragment="error-summary" th:if="${hasErrors != null and hasErrors}">
    <div class="govuk-error-summary" aria-labelledby="error-summary-title" role="alert" tabindex="-1" data-module="govuk-error-summary">
        <h2 class="govuk-error-summary__title" id="error-summary-title">
            There is a problem
        </h2>
        <div class="govuk-error-summary__body">
            <ul class="govuk-list govuk-error-summary__list">
                <li th:each="error : ${errorSummary}">
                    <a th:href="${error.anchor}" th:text="${error.errorMessage}">Error message</a>
                </li>
            </ul>
        </div>
    </div>
</div>

<!-- Inline error messages -->
<div  th:fragment="error-field-radio" th:if="${hasErrors != null and hasErrors}">
    <div th:each="error : ${errorSummary}">
        <p th:if="${error.fieldId.contains(radioGroupName)}"
           th:id="${radioGroupName + '-error'}"
           class="govuk-error-message">
            <span class="govuk-visually-hidden">Error:</span>
            <span th:text="${error.errorMessage}">This field is required</span>
        </p>
    </div>
</div>

<!-- Inline error messages for text inputs (fieldId parameter) -->
<div th:fragment="error-field-text(fieldId)" th:if="${hasErrors != null and hasErrors}">
    <div th:each="error : ${errorSummary}">
        <p th:if="${error.fieldId == fieldId}"
           th:id="${fieldId + '-error'}"
           class="govuk-error-message">
            <span class="govuk-visually-hidden">Error:</span>
            <span th:text="${error.errorMessage}">This field is required</span>
        </p>
    </div>
</div>

</body>
</html>
